server.port=8082
spring.application.name=transaction-service

# PostgreSQL (Neon ? shared DB)
spring.datasource.url=jdbc:postgresql://ep-rapid-base-ah1999lk-pooler.c-3.us-east-1.aws.neon.tech/neondb
spring.datasource.username=neondb_owner
spring.datasource.password=npg_SA7hmuaRzyk4
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect



# ===================== KAFKA =====================
spring.kafka.bootstrap-servers=localhost:9092

# --- PRODUCER ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=transactionAuditEvent:com.onlinebanking.transactionservice.dto.TransactionAuditEvent

# --- CONSUMER ---
spring.kafka.consumer.group-id=transaction-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*


# ===================== LOGGING =====================
logging.level.org.springframework.kafka=INFO
logging.level.com.onlinebanking.transactionservice.service.AuditProducerService=DEBUG


# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
