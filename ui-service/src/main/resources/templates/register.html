<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBank | Inscription</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/home-style.css}">
    <style>
        body { background: #F5F3FF; padding: 40px 20px; font-family: 'Outfit', sans-serif; }
        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.1);
        }
        .form-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #8B5CF6;
            margin: 2rem 0 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #F5F3FF;
            padding-bottom: 5px;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.85rem; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #A78BFA; }
        input, select {
            width: 100%; padding: 12px 15px 12px 45px; border: 1px solid #E2E8F0; border-radius: 12px; font-family: 'Outfit';
        }
        input:focus { outline: none; border-color: #8B5CF6; }
        .logo-center { text-align: center; margin-bottom: 2rem; font-size: 2rem; font-weight: 700; }
        .logo-center span { background: linear-gradient(135deg, #8B5CF6 0%, #D946EF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="logo-center">NexBank<span>Digital</span></div>
    <h2 style="text-align: center;">Ouvrir un compte</h2>

    <form method="post" action="/register">
        <div class="form-section-title"><i class="fas fa-key"></i> Identifiants</div>
        <div class="form-row">
            <div class="form-group">
                <label>Nom d'utilisateur *</label>
                <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" name="username" required></div>
            </div>
            <div class="form-group">
                <label>Mot de passe *</label>
                <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" name="password" required></div>
            </div>
        </div>

        <div class="form-section-title"><i class="fas fa-user-circle"></i> Informations Personnelles</div>
        <div class="form-row">
            <div class="form-group">
                <label>Prénom</label>
                <div class="input-wrapper"><i class="fas fa-id-card"></i><input type="text" name="firstName"></div>
            </div>
            <div class="form-group">
                <label>Nom</label>
                <div class="input-wrapper"><i class="fas fa-id-card"></i><input type="text" name="lastName"></div>
            </div>
        </div>
        <div class="form-group">
            <label>Numéro de Compte *</label>
            <div class="input-wrapper"><i class="fas fa-hashtag"></i><input type="text" name="accountNumber" required></div>
        </div>

        <div class="form-section-title"><i class="fas fa-envelope"></i> Contact</div>
        <div class="form-row">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper"><i class="fas fa-at"></i><input type="email" name="email"></div>
            </div>
            <div class="form-group">
                <label>Téléphone</label>
                <div class="input-wrapper"><i class="fas fa-phone"></i><input type="text" name="phoneNumber"></div>
            </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; margin-top: 2rem;">Créer mon compte NexBank</button>
    </form>

    <div th:if="${error}" class="alert alert-error" style="margin-top: 1rem; background: #FEF2F2; color: #991B1B; padding: 1rem; border-radius: 12px;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <div style="text-align: center; margin-top: 2rem; font-size: 0.9rem;">
        Déjà client ? <a th:href="@{/login}" style="color: #8B5CF6; font-weight: 600; text-decoration: none;">Se connecter</a>
    </div>
</div>
</body>
</html>
