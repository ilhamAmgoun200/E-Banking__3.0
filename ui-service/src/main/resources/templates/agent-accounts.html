<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBank | Espace Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #F8FAFC;
            color: #1E293B;
            min-height: 100vh;
        }

        /* NAVBAR AGENT (Vert Emeraude) */
        .agent-navbar {
            background: #064E3B; /* Vert très sombre */
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 1.5rem; font-weight: 800; }
        .logo span { color: #10B981; }

        .agent-info-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 12px;
        }
        .avatar {
            width: 35px; height: 35px; background: #10B981;
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-weight: 700;
        }

        .btn-logout {
            color: #FDA4AF; text-decoration: none; font-weight: 600;
            font-size: 0.9rem; margin-left: 20px; transition: 0.3s;
        }
        .btn-logout:hover { color: #F43F5E; }

        .container { max-width: 1400px; margin: 2rem auto; padding: 0 2rem; }

        /* HEADER PAGE */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .page-header h1 { font-size: 2rem; font-weight: 800; color: #0F172A; }
        .page-header p { color: #64748B; }

        /* STATS (Style NexBank) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: white; padding: 1.5rem; border-radius: 20px;
            border: 1px solid #E2E8F0; display: flex; align-items: center; gap: 15px;
        }
        .stat-icon {
            width: 50px; height: 50px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .icon-green { background: #ECFDF5; color: #10B981; }
        .icon-blue { background: #EFF6FF; color: #3B82F6; }
        .icon-orange { background: #FFF7ED; color: #F59E0B; }

        /* RECHERCHE */
        .search-section {
            background: white; padding: 1.2rem; border-radius: 20px;
            margin-bottom: 2rem; border: 1px solid #E2E8F0;
        }
        .search-input-wrapper { position: relative; }
        .search-input-wrapper i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94A3B8; }
        .search-input-wrapper input {
            width: 100%; padding: 0.8rem 1rem 0.8rem 3rem;
            border: 1px solid #E2E8F0; border-radius: 12px; font-family: inherit;
        }

        /* TABLEAU */
        .nb-card {
            background: white; border-radius: 24px; border: 1px solid #E2E8F0;
            overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .nb-table { width: 100%; border-collapse: collapse; }
        .nb-table th {
            background: #F8FAFC; padding: 1.2rem; text-align: left;
            font-size: 0.8rem; color: #64748B; text-transform: uppercase;
        }
        .nb-table td { padding: 1.2rem; border-bottom: 1px solid #F1F5F9; font-size: 0.9rem; }
        .nb-table tr:hover { background: #F0FDF4; }

        /* BADGES */
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .badge-active { background: #DCFCE7; color: #15803D; }
        .badge-inactive { background: #FEF2F2; color: #EF4444; }

        /* BUTTONS */
        .btn {
            padding: 8px 16px; border-radius: 10px; border: none;
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            display: inline-flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .btn-add { background: #10B981; color: white; }
        .btn-edit { background: #EFF6FF; color: #3B82F6; }
        .btn-toggle { background: #FFF7ED; color: #F59E0B; }
        .btn-view { background: #F8FAFC; color: #64748B; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* MODALS */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px);
            z-index: 2000;
        }
        .modal-content {
            background: white; width: 90%; max-width: 500px;
            margin: 5% auto; padding: 2rem; border-radius: 24px;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 0.7rem; border: 1px solid #E2E8F0; border-radius: 10px;
        }

        .no-results { text-align: center; padding: 3rem; display: none; }
    </style>
</head>
<body>

<header class="agent-navbar">
    <div class="logo">Nex<span>Bank</span> <small style="font-size: 0.7rem; opacity: 0.7;">AGENT</small></div>
    <div style="display: flex; align-items: center;">
        <div class="agent-info-box">
            <div class="avatar">A</div>
            <div style="font-size: 0.85rem;">
                <div style="font-weight: 700;">Agent NexBank</div>
                <div style="opacity: 0.8;" th:text="${#dates.format(#dates.createNow(),'dd MMM yyyy')}">Date</div>
            </div>
        </div>
        <a href="/logout" class="btn-logout"><i class="fas fa-power-off"></i></a>
    </div>
</header>

<div class="container">
    <div class="page-header">
        <div>
            <h1>Gestion Clients</h1>
            <p>Administration des comptes et profils utilisateurs.</p>
        </div>
        <button class="btn btn-add" onclick="openCreateModal()">
            <i class="fas fa-plus"></i> Nouveau Client
        </button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon icon-green"><i class="fas fa-users"></i></div>
            <div>
                <h3 style="font-size: 0.8rem; color: #64748B;">Total Clients</h3>
                <div style="font-size: 1.5rem; font-weight: 800;" th:text="${totalClients}">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon icon-blue"><i class="fas fa-check-double"></i></div>
            <div>
                <h3 style="font-size: 0.8rem; color: #64748B;">Comptes Actifs</h3>
                <div style="font-size: 1.5rem; font-weight: 800; color: #10B981;" th:text="${totalActive}">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon icon-orange"><i class="fas fa-wallet"></i></div>
            <div>
                <h3 style="font-size: 0.8rem; color: #64748B;">Volume Géré</h3>
                <div style="font-size: 1.2rem; font-weight: 800;" th:text="${totalBalance} + ' DH'">0 DH</div>
            </div>
        </div>
    </div>

    <div class="search-section">
        <div class="search-input-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Rechercher par numéro, nom ou username..." onkeyup="filterTable()">
        </div>
    </div>

    <div class="nb-card" id="tableWrapper">
        <table class="nb-table" id="accountsTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Numéro</th>
                <th>Titulaire</th>
                <th>Username</th>
                <th>Statut</th>
                <th>Solde</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="account : ${accounts}">
                <td th:text="${account['id']}" style="color: #94A3B8;"></td>
                <td><strong style="color: #064E3B;" th:text="${account['accountNumber']}"></strong></td>
                <td th:text="${account['accountHolderName']}"></td>
                <td th:text="${account['username']}"></td>
                <td>
                    <span th:if="${account['status']=='ACTIVE'}" class="badge badge-active">Actif</span>
                    <span th:if="${account['status']=='INACTIVE'}" class="badge badge-inactive">Inactif</span>
                </td>
                <td style="font-weight: 700;" th:text="${account['balance']} + ' DH'"></td>
                <td style="display: flex; gap: 8px;">
                    <form th:action="@{'/agent/accounts/' + ${account['id']} + '/toggle-status'}" method="post">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-toggle" title="Changer Statut"><i class="fas fa-sync"></i></button>
                    </form>
                    <button class="btn btn-edit" th:attr="data-id=${account['id']}, data-account-number=${account['accountNumber']}, data-holder=${account['accountHolderName']}, data-username=${account['username']}, data-status=${account['status']}" onclick="openEditModalFromButton(this)">
                        <i class="fas fa-pen"></i>
                    </button>
                    <button class="btn btn-view" th:attr="data-id=${account['id']}, data-account-number=${account['accountNumber']}, data-holder=${account['accountHolderName']}, data-username=${account['username']}, data-balance=${account['balance']}, data-status=${account['status']}" onclick="viewDetailsFromButton(this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
        <div id="noResults" class="no-results">
            <i class="fas fa-user-slash" style="font-size: 2rem; color: #CBD5E1; margin-bottom: 1rem;"></i>
            <p>Aucun client trouvé pour cette recherche.</p>
        </div>
    </div>
</div>

<div id="createModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 style="font-weight: 800;">Nouveau Client</h2>
            <button onclick="closeCreateModal()" style="border:none; background:none; font-size: 1.5rem; cursor:pointer;">&times;</button>
        </div>
        <form action="/agent/accounts/create" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label>Numéro de Compte</label>
                <input type="text" name="accountNumber" required placeholder="Ex: ACC-2026-XXXX">
            </div>
            <div class="form-group">
                <label>Nom complet</label>
                <input type="text" name="accountHolderName" required>
            </div>
            <div class="form-group">
                <label>Username (Login)</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Statut Initial</label>
                <select name="status">
                    <option value="ACTIVE">Actif</option>
                    <option value="INACTIVE">Inactif</option>
                </select>
            </div>
            <button type="submit" class="btn btn-add" style="width:100%; justify-content:center; margin-top:1rem;">Créer le profil</button>
        </form>
    </div>
</div>

<script>
    function openCreateModal(){ document.getElementById('createModal').style.display='block'; }
    function closeCreateModal(){ document.getElementById('createModal').style.display='none'; }

    function filterTable(){
        const filter = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#accountsTable tbody tr');
        let visible = 0;
        rows.forEach(r=>{
            const text = r.innerText.toLowerCase();
            if(text.includes(filter)){ r.style.display=''; visible++; } else { r.style.display='none'; }
        });
        document.getElementById('noResults').style.display = visible ? 'none' : 'block';
    }

    // Gestion fermeture modals clic extérieur
    window.onclick = function(e){
        if(e.target.className === 'modal') e.target.style.display='none';
    }
</script>

</body>
</html>
