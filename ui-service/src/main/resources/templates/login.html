<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBank | Connexion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/home-style.css}">
    <style>
        body {
            background: radial-gradient(circle at top right, rgba(217, 70, 239, 0.1), transparent), #F5F3FF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.1);
            border: 1px solid #E2E8F0;
        }
        .logo-auth {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
            color: #0A192F;
        }
        .logo-auth span { background: linear-gradient(135deg, #8B5CF6 0%, #D946EF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #1E293B; font-size: 0.9rem; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #8B5CF6; }
        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            transition: 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #8B5CF6; box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1); }

        .alert { padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
        .alert-success { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
        .alert-error { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }

        .auth-footer { text-align: center; margin-top: 2rem; color: #64748B; font-size: 0.9rem; }
        .auth-footer a { color: #8B5CF6; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="logo-auth">NexBank<span>Digital</span></div>
    <h2 style="text-align: center; margin-bottom: 0.5rem;">Bon retour !</h2>
    <p style="text-align: center; color: #64748B; margin-bottom: 2rem;">Connectez-vous à votre espace sécurisé</p>

    <div th:if="${param.logout}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> Déconnexion réussie.
    </div>

    <form method="post" action="/login">
        <div class="form-group">
            <label>Nom d'utilisateur</label>
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" name="username" required placeholder="Ex: noufissa123">
            </div>
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">Se connecter</button>
    </form>

    <div th:if="${error}" class="alert alert-error" style="margin-top: 1rem;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <div class="auth-footer">
        Nouveau chez NexBank ? <a th:href="@{/register}">Créer un compte</a>
    </div>
</div>
</body>
</html>
