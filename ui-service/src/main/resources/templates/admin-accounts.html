<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBank | Admin - Comptes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/home-style.css}">
    <style>
        body { background-color: #F8FAFC; color: #1E293B; font-family: 'Outfit', sans-serif; }

        /* Navbar Admin */
        .admin-nav-bar {
            background: #0F172A;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            position: sticky; top: 0; z-index: 1000;
        }
        .admin-nav-links { display: flex; gap: 20px; }
        .admin-nav-links a { color: #94A3B8; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .admin-nav-links a.active { color: #D946EF; font-weight: 700; }
        .admin-nav-links a:hover { color: white; }

        .container { max-width: 1400px; margin: 2rem auto; padding: 0 20px; }

        /* Dashboard Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid #E2E8F0;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(139, 92, 246, 0.1); }
        .stat-icon {
            width: 50px; height: 50px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .bg-mauve { background: #F5F3FF; color: #8B5CF6; }
        .bg-pink { background: #FDF2F8; color: #DB2777; }
        .bg-cyan { background: #ECFEFF; color: #0891B2; }

        /* Filtres */
        .filter-bar {
            background: white;
            padding: 1.5rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .filter-group { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .filter-group label { font-size: 0.8rem; font-weight: 700; color: #64748B; text-transform: uppercase; }

        /* Table Style */
        .table-wrapper {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #E2E8F0;
        }
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th { background: #F8FAFC; padding: 1rem 1.5rem; text-align: left; font-size: 0.8rem; color: #64748B; border-bottom: 2px solid #F1F5F9; }
        .admin-table td { padding: 1.2rem 1.5rem; border-bottom: 1px solid #F1F5F9; font-size: 0.9rem; }

        /* Badges Rôles */
        .role-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .role-client { background: #DBEAFE; color: #1E40AF; }
        .role-agent { background: #FEF3C7; color: #92400E; }
        .role-admin { background: #FCE7F3; color: #BE185D; }

        /* Actions */
        .action-btn { width: 35px; height: 35px; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-edit { background: #F1F5F9; color: #64748B; }
        .btn-edit:hover { background: #8B5CF6; color: white; }
        .btn-del { background: #FEF2F2; color: #EF4444; }
        .btn-del:hover { background: #EF4444; color: white; }

        /* Modal Custom */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); z-index: 2000;
        }
        .modal-content {
            background: white; width: 90%; max-width: 550px; margin: 5% auto;
            padding: 2.5rem; border-radius: 24px; position: relative;
        }
    </style>
</head>
<body>

<header class="admin-nav-bar">
    <div class="logo">NexBank<span style="color: #D946EF;">Admin</span></div>
    <nav class="admin-nav-links">
        <a href="/admin/users"><i class="fas fa-users"></i> Utilisateurs</a>
        <a href="/admin/accounts" class="active"><i class="fas fa-wallet"></i> Comptes</a>
    </nav>
    <a href="/logout" class="btn-outline" style="color: white; border-color: #334155; font-size: 0.8rem;">Quitter</a>
</header>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
            <h1 style="font-weight: 800; font-size: 2rem;">Gestion des Comptes</h1>
            <p style="color: #64748B;">Supervision globale des accès et des soldes bancaires.</p>
        </div>
        <button class="btn-primary" onclick="openCreateModal()" style="border:none; cursor:pointer;">
            <i class="fas fa-plus-circle"></i> Nouveau Compte
        </button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon bg-mauve"><i class="fas fa-user-friends"></i></div>
            <div>
                <small style="color: #64748B;">Clients</small>
                <div id="totalClients" style="font-size: 1.2rem; font-weight: 800;">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-pink"><i class="fas fa-user-tie"></i></div>
            <div>
                <small style="color: #64748B;">Agents</small>
                <div id="totalAgents" style="font-size: 1.2rem; font-weight: 800;">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-cyan"><i class="fas fa-shield-alt"></i></div>
            <div>
                <small style="color: #64748B;">Admins</small>
                <div id="totalAdmins" style="font-size: 1.2rem; font-weight: 800;">0</div>
            </div>
        </div>
        <div class="stat-card" style="border-left: 4px solid #10B981;">
            <div>
                <small style="color: #64748B;">Actifs</small>
                <div id="totalActive" style="font-size: 1.2rem; font-weight: 800; color: #10B981;">0</div>
            </div>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <label>Rôle</label>
            <select id="roleFilter" onchange="applyFilters()">
                <option value="">Tous les rôles</option>
                <option value="CLIENT">Client</option>
                <option value="AGENT">Agent</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Statut</label>
            <select id="statusFilter" onchange="applyFilters()">
                <option value="">Tous les statuts</option>
                <option value="ACTIVE">Actif</option>
                <option value="INACTIVE">Inactif</option>
            </select>
        </div>
        <button class="btn-outline" onclick="resetFilters()" style="height: 45px;">
            <i class="fas fa-sync"></i>
        </button>
    </div>

    <div class="table-wrapper">
        <table class="admin-table">
            <thead>
            <tr>
                <th>N° Compte</th>
                <th>Titulaire</th>
                <th>Username</th>
                <th>Rôle</th>
                <th>Statut</th>
                <th>Solde</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="accountsTableBody">
            </tbody>
        </table>
    </div>
</div>

<div id="createModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-bottom: 1.5rem;">🆕 Créer un compte</h2>
        <form action="/admin/accounts/create" method="post">
            <div class="form-group">
                <label>Type de profil *</label>
                <select id="createRole" name="role" required onchange="toggleFormFields()">
                    <option value="">Sélectionner...</option>
                    <option value="CLIENT">Client (Standard)</option>
                    <option value="AGENT">Agent (Banque)</option>
                    <option value="ADMIN">Administrateur</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label>Nom d'utilisateur *</label>
                <input type="text" name="username" required placeholder="ex: j.doe">
            </div>

            <div id="clientFields" style="display: none; background: #F8FAFC; padding: 15px; border-radius: 12px; margin-top: 15px;">
                <div class="form-group">
                    <label>Numéro de Compte</label>
                    <input type="text" id="clientAccountNumber" name="accountNumberClient" placeholder="ACC-XXXX">
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <label>Nom Complet</label>
                    <input type="text" id="clientAccountHolderName" name="accountHolderNameClient">
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <label>Solde Initial (€)</label>
                    <input type="number" id="clientBalance" name="balanceClient" step="0.01" value="0">
                </div>
            </div>

            <input type="hidden" id="hiddenAccountNumber" name="accountNumber">
            <input type="hidden" id="hiddenAccountHolderName" name="accountHolderName">
            <input type="hidden" id="hiddenBalance" name="balance" value="0">

            <div id="staffFields" style="display: none; margin-top: 15px;">
                <div class="form-group">
                    <label>Nom complet du collaborateur</label>
                    <input type="text" id="staffAccountHolderName" name="accountHolderNameStaff">
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 2rem;">
                <button type="button" class="btn-outline" onclick="closeCreateModal()" style="flex:1;">Annuler</button>
                <button type="submit" class="btn-primary" style="flex:1; border:none;">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    let allAccounts = [];

    window.onload = function() {
        loadStatistics();
        loadAccounts();
    };

    async function loadStatistics() {
        try {
            const res = await fetch('http://localhost:8081/accounts/stats');
            const stats = await res.json();
            document.getElementById('totalClients').textContent = stats.totalClients;
            document.getElementById('totalAgents').textContent = stats.totalAgents;
            document.getElementById('totalAdmins').textContent = stats.totalAdmins;
            document.getElementById('totalActive').textContent = stats.totalActive;
        } catch(e) { console.error(e); }
    }

    async function loadAccounts() {
        try {
            const res = await fetch('http://localhost:8081/accounts');
            allAccounts = await res.json();
            displayAccounts(allAccounts);
        } catch(e) { console.error(e); }
    }

    function displayAccounts(accounts) {
        const tbody = document.getElementById('accountsTableBody');
        tbody.innerHTML = '';
        accounts.forEach(acc => {
            const roleClass = 'role-' + acc.role.toLowerCase();
            const statusColor = acc.status === 'ACTIVE' ? '#10B981' : '#EF4444';

            tbody.innerHTML += `
                <tr>
                    <td><strong style="color:#8B5CF6">${acc.accountNumber}</strong></td>
                    <td>${acc.accountHolderName}</td>
                    <td><code style="background:#F1F5F9; padding:2px 5px; border-radius:4px;">${acc.username}</code></td>
                    <td><span class="role-badge ${roleClass}">${acc.role}</span></td>
                    <td><span style="color:${statusColor}; font-weight:700;">● ${acc.status}</span></td>
                    <td style="font-weight:700;">${acc.balance.toFixed(2)} €</td>
                    <td>
                        <div style="display:flex; gap:5px;">
                            <button class="action-btn btn-edit" onclick='alert("Édition de ${acc.id}")'><i class="fas fa-pen"></i></button>
                            <button class="action-btn btn-del" onclick="deleteAccount(${acc.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    function applyFilters() {
        const role = document.getElementById('roleFilter').value;
        const status = document.getElementById('statusFilter').value;
        let filtered = allAccounts.filter(acc => {
            return (!role || acc.role === role) && (!status || acc.status === status);
        });
        displayAccounts(filtered);
    }

    function resetFilters() {
        document.getElementById('roleFilter').value = '';
        document.getElementById('statusFilter').value = '';
        displayAccounts(allAccounts);
    }

    function openCreateModal() { document.getElementById('createModal').style.display = 'block'; }
    function closeCreateModal() { document.getElementById('createModal').style.display = 'none'; }

    function toggleFormFields() {
        const role = document.getElementById('createRole').value;
        document.getElementById('clientFields').style.display = (role === 'CLIENT') ? 'block' : 'none';
        document.getElementById('staffFields').style.display = (role === 'AGENT' || role === 'ADMIN') ? 'block' : 'none';

        if (role !== 'CLIENT' && role !== '') {
            document.getElementById('hiddenAccountNumber').value = role + '-' + Date.now();
        }
    }

    function deleteAccount(id) {
        if (confirm('Supprimer définitivement ce compte ?')) {
            const f = document.createElement('form');
            f.method = 'POST'; f.action = '/admin/accounts/' + id + '/delete';
            document.body.appendChild(f); f.submit();
        }
    }
</script>

</body>
</html>
